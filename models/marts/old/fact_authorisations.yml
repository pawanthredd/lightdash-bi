version: 2

models:

  - name: fact_authorisations_

    description: >
      Fact table containing all card authorization attempts processed by the
      issuer platform. Each record represents a single authorization request,
      including approved and declined attempts. This table supports analysis
      of authorization volume, approval performance, fraud monitoring,
      transaction channels, merchant behavior, and customer payment activity.


    columns:


      - name: authorisation_id

        description: Unique identifier for the authorization request.

        config:
          meta:
            metrics:


              total_authorisations:
                label: Total Authorisations
                description: Count of unique authorization requests.
                type: count_distinct



              approved_authorisations:
                label: Approved Authorisations
                description: Count of approved authorization requests.
                type: count_distinct

                filters:

                  - approved_flag: true



              declined_authorisations:
                label: Declined Authorisations
                description: Count of declined authorization requests.
                type: count_distinct

                filters:

                  - approved_flag: false




      - name: card_id

        description: Identifier of the card used for the authorization.

        config:
          meta:
            metrics:


              active_authorisation_cards:
                label: Cards With Authorisations
                description: Number of unique cards that generated authorization requests.
                type: count_distinct




      - name: customer_id

        description: Identifier of the customer who initiated the authorization.

        config:
          meta:
            metrics:


              customers_with_authorisations:
                label: Customers With Authorisations
                description: Number of unique customers generating authorization requests.
                type: count_distinct




      - name: merchant_id

        description: Identifier of the merchant where authorization occurred.




      - name: authorisation_date

        description: Date when authorization request was processed.




      - name: authorisation_timestamp

        description: Timestamp when authorization request was received.




      - name: merchant_category

        description: Merchant business category where transaction occurred.




      - name: country

        description: Country where authorization occurred.




      - name: currency

        description: Currency of the authorization request.




      - name: amount

        description: Authorization amount requested.

        config:
          meta:
            metrics:


              total_authorisation_amount:
                label: Total Authorisation Amount
                description: Total monetary value of authorization requests.
                type: sum


              average_authorisation_amount:
                label: Average Authorisation Amount
                description: Average authorization amount.
                type: average




      - name: response_code

        description: Payment network response code returned for the authorization.




      - name: approved_flag

        description: Indicates whether the authorization was approved.




      - name: decline_reason

        description: Reason for authorization decline when applicable.




      - name: fraud_score

        description: Fraud risk score assigned to the authorization.

        config:
          meta:
            metrics:


              average_fraud_score:
                label: Average Fraud Score
                description: Average fraud score across authorization requests.
                type: average



              maximum_fraud_score:
                label: Highest Fraud Score
                description: Highest fraud score observed.
                type: max




      - name: channel

        description: Channel where authorization originated, such as POS, Ecommerce, ATM, or Mobile.




      - name: entry_mode

        description: Method used to capture card information, such as Chip, Contactless, or Manual.




      - name: device_type

        description: Device used to initiate the authorization request.




      - name: created_at

        description: Timestamp when authorization record was created.
version: 2

models:
  - name: fact_transactions
    description: >
      Financial settlement transactions after authorisation clearing.

    columns:
      - name: transaction_id
        description: Unique transaction identifier.

        config:
          meta:
            metrics:
              total_transactions:
                label: Total Transactions
                description: Number of transactions.
                type: count_distinct

      - name: authorisation_id
        description: Linked authorisation identifier.

      - name: card_id
        description: Card used in transaction.

      - name: product_id
        description: Product linked to transaction.

      - name: transaction_datetime
        description: Timestamp of transaction.

      - name: settlement_date
        description: Settlement date.

      - name: transaction_type
        description: Type of transaction.

      - name: merchant_id
        description: Merchant identifier.

      - name: mcc_code
        description: Merchant category code.

      - name: transaction_amount
        description: Transaction amount.

        config:
          meta:
            metrics:
              total_transaction_amount:
                label: Total Spend
                description: Total transaction value.
                type: sum

              avg_transaction_amount:
                label: Average Transaction Amount
                description: Average transaction value.
                type: average

              max_transaction_amount:
                label: Max Transaction Amount
                description: Maximum transaction value.
                type: max

      - name: currency
        description: Transaction currency.

      - name: interchange_amount
        description: Interchange revenue.

        config:
          meta:
            metrics:
              total_interchange:
                label: Total Interchange
                description: Sum of interchange revenue.
                type: sum

      - name: scheme_fee_amount
        description: Scheme fees charged.

        config:
          meta:
            metrics:
              total_scheme_fees:
                label: Total Scheme Fees
                description: Sum of scheme fees.
                type: sum

      - name: processor_fee_amount
        description: Processor fees charged.

        config:
          meta:
            metrics:
              total_processor_fees:
                label: Total Processor Fees
                description: Sum of processor fees.
                type: sum

      - name: net_settlement_amount
        description: Net settlement amount.

        config:
          meta:
            metrics:
              total_net_settlement:
                label: Net Settlement
                description: Total net settlement amount.
                type: sum

      - name: transaction_status
        description: Current transaction status.
version: 2

models:
  - name: dim_program_manager
    description: >
      Dimension table containing Program Manager information within the issuer
      processing platform. A Program Manager is responsible for designing,
      managing, and operating card programs under a BIN Sponsor.

    columns:
      - name: program_manager_id
        description: Unique identifier assigned to the Program Manager.

        config:
          meta:
            metrics:
              total_program_managers:
                label: Total Program Managers
                description: Number of Program Managers.
                type: count_distinct

      - name: program_manager_name
        description: Official business name of the Program Manager.

      - name: bin_sponsor_id
        description: Identifier of the BIN Sponsor supporting the Program Manager.

      - name: industry_vertical
        description: Industry segment served by the Program Manager.

      - name: country_code
        description: ISO country code of the Program Manager.

      - name: onboarded_date
        description: Date Program Manager was onboarded.

      - name: status
        description: Current operational status.

      - name: fee_tier
        description: Commercial pricing tier assigned to Program Manager.
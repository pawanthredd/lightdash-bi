version: 2

models:
  - name: dim_bin_sponsor
    description: >
      Dimension table containing BIN Sponsor information within the issuer
      processing platform. A BIN Sponsor is the licensed financial institution
      that owns one or more Bank Identification Number (BIN) ranges and sponsors
      card issuing programs managed by Program Managers. This table stores
      sponsor attributes including geographic information, BIN ranges, sponsor
      tier, onboarding details, operational status, and risk classification.
      It is commonly joined with Program Managers and Products to analyze issuer
      portfolios, sponsor performance, and regional distribution.

    columns:
      - name: bin_sponsor_id
        description: Unique identifier assigned to the BIN Sponsor.

        config:
          meta:
            metrics:
              total_bin_sponsors:
                label: Total BIN Sponsors
                description: Number of unique BIN Sponsors.
                type: count_distinct

      - name: bin_sponsor_name
        description: Official business name of the BIN Sponsor or issuing financial institution.

      - name: country_code
        description: ISO 3166-1 alpha-2 country code representing the country where the BIN Sponsor is registered or operates.

      - name: region
        description: Geographic region in which the BIN Sponsor operates.

      - name: bin_range_start
        description: Starting BIN value allocated to the sponsor.

      - name: bin_range_end
        description: Ending BIN value allocated to the sponsor.

      - name: sponsor_tier
        description: Classification of BIN Sponsor based on service level or strategic importance.

      - name: onboarded_date
        description: Date on which the BIN Sponsor was onboarded into the issuer processing platform.

      - name: status
        description: Current operational status of the BIN Sponsor.

      - name: risk_rating
        description: Internal risk assessment assigned to the BIN Sponsor.
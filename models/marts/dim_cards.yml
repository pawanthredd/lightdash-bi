version: 2

models:
  - name: dim_cards
    description: >
      Dimension table containing issued payment cards.

    columns:
      - name: card_id
        description: Unique identifier assigned to an issued payment card.

        config:
          meta:
            metrics:
              total_cards:
                label: Total Cards
                description: Number of issued cards.
                type: count_distinct

      - name: product_id
        description: Identifier of the card product.

      - name: cardholder_ref
        description: Reference identifier of the cardholder.

        config:
          meta:
            metrics:
              unique_cardholders:
                label: Unique Cardholders
                description: Number of distinct cardholders.
                type: count_distinct

      - name: card_type
        description: Type of card issued.

      - name: issue_date
        description: Date card was issued.

      - name: activation_date
        description: Date card was activated.

      - name: expiry_date
        description: Expiry date of the card.

      - name: card_status
        description: Current status of the card.
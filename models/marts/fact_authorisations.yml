version: 2

models:
  - name: fact_authorisations
    description: >
      Card authorisation events captured before settlement.

    columns:
      - name: authorisation_id
        description: Unique authorisation identifier.

        config:
          meta:
            metrics:
              total_authorisations:
                label: Total Authorisations
                description: Number of authorisations.
                type: count_distinct

      - name: card_id
        description: Card used for the authorisation.

      - name: product_id
        description: Product linked to the authorisation.

      - name: authorisation_datetime
        description: Timestamp of authorisation event.

      - name: merchant_id
        description: Merchant identifier.

      - name: merchant_name
        description: Merchant name.

      - name: mcc_code
        description: Merchant category code.

      - name: mcc_description
        description: MCC description.

      - name: merchant_country
        description: Merchant country.

      - name: channel
        description: Channel of transaction.

      - name: pos_entry_mode
        description: POS entry mode.

      - name: auth_amount
        description: Authorised amount.

        config:
          meta:
            metrics:
              total_auth_amount:
                label: Total Auth Amount
                description: Sum of authorised amounts.
                type: sum

              avg_auth_amount:
                label: Average Auth Amount
                description: Average authorisation amount.
                type: average

              max_auth_amount:
                label: Max Auth Amount
                description: Maximum authorisation amount.
                type: max

      - name: currency
        description: Currency of authorisation.

      - name: auth_response_code
        description: Response code.

      - name: auth_status
        description: Approval status.

      - name: decline_reason
        description: Reason for decline.